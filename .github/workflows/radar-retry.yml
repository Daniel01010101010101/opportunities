# Reintento automático: si una ejecución PROGRAMADA del radar falla, se relanza una vez tras 3 minutos.
name: Reintento del radar

on:
  workflow_run:
    workflows: ["Radar de oportunidades"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2 &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Esperar y relanzar los trabajos fallidos
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sleep 180
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
