# Fuentes iniciales del radar. El motor además DESCUBRE fuentes nuevas: cada dominio oficial que aparece
# enlazado desde una noticia o búsqueda se registra en data/sources.json como "descubierta" y se vuelve a
# consultar en ejecuciones siguientes.
#
# Tipos:
#   bing_news  -> Bing Noticias RSS (gratis, sin clave). Uso personal no comercial según sus condiciones.
#   gdelt      -> GDELT DOC 2.0 API (gratis, sin clave, límite ~1 consulta cada 5 s).
#   rss        -> Feed RSS/Atom oficial.
#   page_links -> Página oficial de listado (promociones, términos, convocatorias): se extraen los enlaces
#                 que cumplan "include" y se analizan uno por uno.
#   google_cse -> Google Programmable Search JSON API (opcional: GOOGLE_CSE_KEY + GOOGLE_CSE_CX).
#   brave      -> Brave Search API (opcional: BRAVE_API_KEY).
#
# every_hours: cada cuántas horas se consulta (controla el consumo). Las fuentes que fallaron se reintentan
# en la siguiente ejecución aunque no les toque.
# hints: pistas de clasificación (section / category) que se aplican si el análisis del texto no es concluyente.

defaults:
  every_hours: 6
  max_items: 12

# Máximo de fuentes de cada tipo por ejecución (las que llevan más tiempo sin consultarse van primero).
limits:
  bing_news: 40
  gdelt: 2   # GDELT limita mucho las consultas (429 / cierres de conexión)
  news_feed: 40
  wp_search: 24
  google_cse: 6
  brave: 6

# Plantillas que generan muchas consultas. {term} se reemplaza por cada término y {year} por el año actual.
# Bing Noticias NO acepta el operador OR: cada consulta debe ser una frase simple.
generators:
  - id: concursos-frases
    type: bing_news
    name: "Noticias · {term}"
    template: "{term} {year}"
    every_hours: 6
    hints: {section: concursos}
    terms:
      - sorteo Colombia participa
      - concurso Colombia participa
      - concurso para ganar
      - así puede participar sorteo
      - cómo participar concurso
      - lanza concurso Colombia
      - abre concurso premios
      - reto con premios Colombia
      - concurso gamer
      - torneo videojuegos premios
      - torneo esports Colombia
      - concurso de fotografía premio
      - concurso de video premio
      - concurso de cuento premio
      - concurso de dibujo premio
      - sorteará un carro
      - sorteará una moto
      - sorteará motos
      - regala boletas
      - gana entradas
      - gana boletas concierto
      - gana un viaje
      - gana un iPhone
      - gana un bono
      - gana mercado
      - premios para usuarios Colombia
      - sorteo para clientes Colombia
      - concurso emisora premios
      - gana una moto
      - gana un carro
  - id: marcas
    type: bing_news
    name: "Noticias · {term} concursos"
    template: "{term} concurso {year}"
    every_hours: 24
    hints: {section: concursos}
    terms: [Kia, Renault, Chevrolet, Mazda, Toyota, Hyundai, BYD, Nissan, Volkswagen, Yamaha, AKT, Bajaj, Auteco, Honda motos, Suzuki motos, TVS,
            Terpel, Primax, Éxito, Olímpica, Alkosto, Ktronix, Falabella, Homecenter, Jumbo, Tiendas D1, Tiendas Ara, Carulla, Rappi, Mercado Libre, DiDi,
            Bancolombia, Davivienda, BBVA, Nequi, Daviplata, Nu Colombia, Movii, Lulo Bank, Puntos Colombia, Claro, Movistar, Tigo, WOM, ETB,
            Postobón, Coca-Cola, Pepsi, Águila, Club Colombia, Poker, Alpina, Colombina, Jet, Zenú, Nestlé, Juan Valdez, McDonald's, KFC, Frisby,
            El Corral, Domino's, Totto, Arturo Calle, Adidas, Nike, Avianca, LATAM, Cine Colombia, Cinemark, Samsung, Xiaomi, Motorola, Huawei,
            PlayStation, Xbox, Riot Games, Red Bull, Gatorade, Colsubsidio, Compensar, Cafam, Caracol Televisión, Canal RCN, Los 40, Tropicana,
            La Mega, Olímpica Stereo, Pilsen, Hit, Quala, Zenú, Bon Bril, Familia, Colgate, Unilever, Natura, Yanbal, Ésika]

